name: MERN stack app revisite ci/cd

on:
  push:
    branches:
      - main

jobs:
  dependency-audit:

    runs-on: ubuntu-26.04

    steps:
      - name: Code checkout to runner
        uses: actions/checkout@v5
      - name: Node checkout
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Backend package install
        run:  npm ci
      - name: Backend audit
        run:  npm audit --omit=dev --audit-level=high
      - name: Client package install
        working-directory: client
        run:  npm ci --legacy-peer-deps
      - name: Client audit
        working-directory: client
        continue-on-error: true
        run:  npm audit --omit=dev --audit-level=high

  build-and-trivy-scan:
    needs: dependency-audit
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout to runner
        uses: actions/checkout@v5
      - name: Build backend
        run:  docker build -t mern-backend:ci .
      - name: Backend trivy scan - visibility
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mern-backend:ci
          severity:  'CRITICAL,HIGH'
          exit-code: '0'
      - name: Backend trivy scan - gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mern-backend:ci
          severity:  'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
      - name: Build client
        run:  docker build -t mern-client:ci ./client
      - name: client trivy scan - visibility
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mern-client:ci
          severity:  'CRITICAL,HIGH'
          exit-code: '0'
      - name: Client trivy scan - gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mern-client:ci
          severity:  'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    needs: build-and-trivy-scan
    runs-on: ubuntu-26.04

    steps:
      - name: Deploy to server via ssh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          key:  ${{ secrets.EC2_SSH_KEY }}
          user: ${{ secrets.EC2_USER }}
          script_stop: true
          script: |
            if [! -d mern-stack-app-revisite];
            fi
            cd mern-stack-app-revisite
            git pull origin main
            cat > .env << EOF
            MONGO_URI=${{ secrets.MONGO_URI }}
            EOF
            docker compose up --build -d
