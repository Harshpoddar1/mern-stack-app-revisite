services:
  mern-backend:
    build: ./
    expose:
      - "5000"
    environment:
      - MONGO_URI=${MONGO_URI}
    depends_on:
      - mern-mongo

  mern-mongo:
    image: mongo:7.0
    volumes:
      - my-volume:/data/db

  mern-client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - mern-backend

volumes:
  my-volume:
